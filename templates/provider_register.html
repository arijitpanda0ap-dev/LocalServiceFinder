<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provider Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="form-box">
    <h2>Provider Register</h2>

    <form method="POST">
        <input name="name" placeholder="Name" required>

        <input name="service" placeholder="Service (Plumber, Electrician...)" required>

        <input name="location" placeholder="Location" required>

        <input name="rating" type="number" step="0.1" min="0" max="5" placeholder="Rating (4.5)" required>

        <input name="password" type="password" placeholder="Password" required>

        <button type="submit">Register</button>
    </form>

    <p style="text-align:center; margin-top:15px;">
        Already have account? 
        <a href="/provider_login" style="color:#00c6ff;">Login</a>
    </p>
</div>

</body>
</html>
